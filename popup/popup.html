<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HearHere</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>HearHere</h1>
      <p id="status" class="status">Ready</p>
    </div>
  </header>

  <section class="transport">
    <button id="play" class="primary" type="button" title="Play / Pause"></button>
    <button id="stop" class="ghost" type="button" title="Stop" disabled>
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <p id="hint" class="hint">Select text on the page, then press play.</p>
  </section>

  <section>
    <div class="label-row"><span class="label">Speed</span><span id="rateLabel" class="value">1×</span></div>
    <div id="rates" class="rates seg" role="radiogroup" aria-label="Reading speed"></div>
  </section>

  <section class="toggle-row">
    <div>
      <div class="label">Hover Read</div>
      <div class="sub">Point at a paragraph to hear it</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="hover">
      <span aria-hidden="true"></span>
    </label>
  </section>

  <section>
    <div class="label-row"><span class="label">Voice</span><a href="#" id="openSettings" class="link">Voice settings</a></div>
    <div id="providers" class="seg seg3" role="radiogroup" aria-label="Voice engine">
      <button type="button" role="radio" data-provider="system">System</button>
      <button type="button" role="radio" data-provider="openai">OpenAI</button>
      <button type="button" role="radio" data-provider="elevenlabs">ElevenLabs</button>
    </div>
    <div id="systemVoiceWrap">
      <select id="voice"><option value="">System default</option></select>
    </div>
    <div id="cloudInfo" class="cloud-info" hidden>
      <span id="cloudVoice"></span>
      <span id="usage" class="usage"></span>
    </div>
    <p id="cloudWarn" class="hint warn" hidden></p>
  </section>

  <section class="shortcuts">
    <div class="label">Shortcuts</div>
    <ul id="shortcuts"></ul>
    <a href="#" id="editShortcuts">Change shortcuts</a>
  </section>

  <script src="popup.js"></script>
</body>
</html>
